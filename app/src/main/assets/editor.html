:root{--bg:#f3f6fc;--card:#fff;--ink:#17233a;--muted:#68758d;--blue:#4568e8;--line:#e1e7f0}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,Arial}a{color:var(--blue);text-decoration:none}.card{background:var(--card);padding:16px;border-radius:16px;border:1px solid var(--line);margin:13px 0}h1{font-size:23px}textarea{width:100%;min-height:55vh;background:#101827;color:#e8eef9;border:0;border-radius:12px;padding:14px;direction:ltr;text-align:left;font:14px/1.6 Consolas,monospace;tab-size:4}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 14px;font-size:14px;margin:4px;cursor:pointer}.secondary{background:#eaf0ff;color:#3154cb}.out{white-space:pre-wrap;background:#eef2fa;border-radius:10px;padding:12px;color:#25334c;font-size:14px}.muted{color:var(--muted);font-size:13px}
</style></head><body><a href="index.html">← חזרה לבית</a><h1>⌨️ עורך PHP</h1><div class="card"><div><button class="btn" id="check">בדוק קוד</button><button class="btn secondary" id="save">שמור</button><button class="btn secondary" id="sample">טען דוגמת התא הקולי</button><button class="btn secondary" id="download">הורד PHP</button></div><textarea id="code" spellcheck="false"></textarea><div id="out" class="out">העורך מוכן.</div></div><p class="muted">הבדיקה מזהה בעיות נפוצות בלבד. היא אינה תחליף ל־php -l או למנוע PHP מלא.</p><script>
const sample="<?php\n// חשוב: אין שום תו או רווח לפני <?php, אחרת הוא יודפס למערכת ויקלקל את התשובה.\n\n/*\n ============================================================================\n  מדריך קצר - 5 מושגים שמופיעים בקוד (קראו פעם אחת ואז הכל יהיה ברור)\n ============================================================================\n\n 1) משתנה\n    שם שמתחיל ב-$ ומחזיק ערך.  $phone = \"0501234567\";\n\n 2) מערך (array)\n    רשימה של דברים בתוך סוגריים מרובעים [ ].\n    * רשימה פשוטה:      ['a', 'b', 'c']\n    * רשימה עם שמות:    ['שם' => 'דוד', 'גיל' => 30]\n      כאן כל פריט הוא זוג \"מפתח => ערך\".\n    בקוד הזה כל הגדרה של שלוחה היא מערך עם זוגות כאלה, למשל:\n        'type' => 'record'    ← המשמעות: type=record בכתובת של השרת\n\n 3) הוספה לסוף מערך\n    $steps[] = משהו;   ← מוסיף את \"משהו\" לסוף הרשימה $steps.\n\n 4) לולאה (foreach)\n    foreach ($steps as [$path, $params]) { ... }\n    ← \"עבור כל פריט ברשימה $steps, תריץ את מה שבתוך הסוגריים המסולסלים\".\n    בכל סיבוב, $path הוא הנתיב של השלוחה ו-$params הם ההגדרות שלה.\n\n 5) פונקציה (function)\n    קטע קוד עם שם, שאפשר להפעיל כמה פעמים בלי לכתוב אותו מחדש.\n    function ym(...) { ... }    ← הגדרה (פעם אחת)\n    ym('FileAction', [...]);     ← הפעלה (כמה פעמים שרוצים)\n\n ============================================================================\n  איך הקוד עובד בגדול\n ============================================================================\n  א. קוראים את הנתונים מהכתובת (טלפון, טוקן, goto).\n  ב. בונים רשימה ($steps) של כל השלוחות שצריך ליצור.\n     זה החלק שתשנו הכי הרבה - כל שלוחה היא \"פריט\" ברשימה.\n  ג. עוברים על הרשימה בלולאה ושולחים כל שלוחה לשרת.\n  ד. יוצרים את הקבצים של ההקראות (TTS) של התפריטים.\n  ה. מחזירים למערכת הודעה: הצלחה או כישלון.\n*/\n\n\n// הסתרת הודעות שגיאה של PHP - כדי שלא יודפסו ללקוח וישברו את התשובה למערכת\nerror_reporting(0);\nini_set('display_errors', '0');\n\n\n// ===================== משתנים =====================\n\n// ApiPhone מגיע מהכתובת. הביטוי ?? '' אומר: \"אם לא הגיע כלום, תשתמש בטקסט ריק\"\n// preg_replace('/\\D/', '', ...) מוחק כל תו שהוא לא ספרה (הגנה מפני תווים מוזרים)\n$phone = preg_replace('/\\D/', '', $_GET['ApiPhone'] ?? '');\n\n// goto: משאירים רק אותיות באנגלית, ספרות, קו תחתון, לוכסן ומקף\n$goto  = preg_replace('/[^A-Za-z0-9_\\/\\-]/', '', $_GET['goto'] ?? '');\n\n// token: מפתח ההתחברות של המערכת\n$token = $_GET['token'] ?? '';\n\n// אם אין טלפון או אין טוקן - אין טעם להמשיך. מחזירים שגיאה ויוצאים.\nif ($phone === '' || $token === '') {\n    print \"id_list_message=m-1804.g-hangup\";\n    exit();\n}\n\n// כתובת הבסיס של ה-API. const = ערך קבוע שלא משתנה בהמשך\nconst YM_BASE = 'https://www.call2all.co.il/ym/api/';\n\n\n// ===================== פונקציה 1: ym =====================\n// התפקיד: לשלוח פקודה כלשהי לשרת ולהחזיר true אם הצליח או false אם נכשל.\n//\n// מקבלת שני דברים:\n//   $action - שם הפקודה (למשל 'UpdateExtension' או 'FileAction')\n//   $params - רשימת ההגדרות של הפקודה\n//\n// : bool בסוף השורה אומר שהפונקציה מחזירה אמת/שקר\nfunction ym(string $action, array $params): bool\n{\n    // בונים כתובת מלאה. http_build_query הופכת את המערך לטקסט בצורה: key=value&key2=value2\n    // היתרון: היא מקודדת לבד תווים מיוחדים (למשל # הופך ל-%23, ועברית נעשית תקינה)\n    $url = YM_BASE . $action . '?' . http_build_query($params);\n\n    // שולחים את הבקשה לשרת. ה-@ מסתיר הודעת שגיאה אם החיבור נכשל\n    $raw = @file_get_contents($url);\n\n    // אם החיבור נכשל לגמרי - מחזירים \"נכשל\"\n    if ($raw === false) {\n        return false;\n    }\n\n    // התשובה של השרת היא טקסט בפורמט JSON. הופכים אותה למערך שאפשר לקרוא ממנו\n    $res = json_decode($raw, true);\n\n    // מחזירים \"הצליח\" רק אם השרת ענה responseStatus = OK\n    return isset($res['responseStatus']) && $res['responseStatus'] === 'OK';\n}\n\n\n// ===================== פונקציה 2: ext =====================\n// התפריט/השלוחות תמיד נשלחים עם אותו token ועם אותו קידומת path.\n// במקום לכתוב את זה בכל פעם, הפונקציה הזו מוסיפה אותם לבד.\n//\n// הסימן + בין שני מערכים אומר \"חבר אותם יחד\":\n//   ['token' => ..., 'path' => ...]  +  $params\n// כלומר: ההגדרות שאנחנו שולחים + token + path.\nfunction ext(string $token, string $path, array $params): bool\n{\n    return ym('UpdateExtension', ['token' => $token, 'path' => 'ivr2:' . $path] + $params);\n}\n\n\n// ===================== טקסט התפריט הראשי =====================\n// זה הטקסט שיוקרא למשתמש כשהוא נכנס לתפריט. הנקודה . מחברת מחרוזות\n$menuText = 'לשמיעה הקש 1, יומן שיחות 2, מועדפים 3, צינתוקים 4, אנשי קשר 5, '\n          . 'רשימה שחורה 6, הודמ 7, סיסמא 8, הגדרות נוספות ותמיכה 9, מיקום אחרון כוכבית';\n\n\n// ============================================================================\n//  רשימת השלוחות - החלק החשוב ביותר לשינויים\n// ============================================================================\n// $steps היא הרשימה הגדולה. כל פריט בה נראה כך:\n//\n//     $steps[] = [\"נתיב השלוחה\", [\n//         'הגדרה' => 'ערך',\n//         'הגדרה' => 'ערך',\n//     ]];\n//\n// כלומר פריט = זוג של (1) נתיב, (2) מערך הגדרות.\n// הנתיב אומר \"איפה השלוחה\", וההגדרות אומרות \"מה היא עושה\".\n// אחרי שהרשימה בנויה, הלולאה למטה שולחת כל פריט לשרת בסדר.\n$steps = [];\n\n\n// ---------- שלוחה 1: הקלטה קצרה ----------\n$steps[] = [\"/1/$phone\", [\n    'type'                => 'record',                  // סוג השלוחה: הקלטה\n    'hangup_insert_file'  => 'yes',                     // אם המתקשר ניתק באמצע, ההקלטה עדיין נשמרת\n    'option_record'       => '1--1',\n    'record_ok'           => '#',                       // אישור ההקלטה במקש #\n    'record_stop_any_key' => 'yes',                     // לחיצה על כל מקש עוצרת את ההקלטה\n    'folder_move'         => \"3/$phone/2\",              // לאן ההודעה עוברת אחרי ההקלטה\n    'record_end_goto'     => \"/2/$phone\",               // לאן עוברים בסיום ההקלטה\n    'black_list'          => 'yes',                     // הפעלת חסימת מספרים\n    'muted_messages'      => 'M1012,M1166,M1452',       // הודעות מערכת שלא יושמעו\n]];\n\n\n// ---------- שלוחה 2: הקלטה ארוכה ----------\n$steps[] = [\"/2/$phone\", [\n    'type'                   => 'record',\n    'folder_move'            => \"3/$phone/1\",           // ההודעה נשמרת בתיקייה של התא הקולי\n    'list_tzintuk'           => $phone,                 // רשימת הצינתוקים של המשתמש\n    'record_end_run_tzintuk' => 'yes',                  // בסיום ההקלטה נשלח צינתוק\n    'hangup_send_tzintuk'    => 'yes',                  // גם אם ניתק באמצע\n    'hangup_insert_file'     => 'yes',\n    'record_end_goto'        => 'hangup',               // בסיום ההקלטה מנתקים\n    'black_list'             => 'yes',\n]];\n\n\n// ---------- שלוחה 3: התפריט הראשי של המשתמש ----------\n// כל המקשים למטה (3/1, 3/2 ...) הם תתי-שלוחות של שלוחה זו\n$steps[] = [\"/3/$phone\", [\n    'type'                      => 'menu',              // סוג השלוחה: תפריט\n    'login_add_val_name'        => 'yes',\n    'login_add_val_name_folder' => \"/3/$phone\",\n    'delete_id_exit'            => 'yes',\n]];\n\n\n// ---------- מקש 1: שמיעת הודעות ----------\n$steps[] = [\"/3/$phone/1\", [\n    'type'                      => 'playfile',          // סוג השלוחה: השמעת קבצים\n    'playfile_move_file_to_old' => 'yes',               // הודעה שהושמעה עוברת לארכיון\n    'playfile_end_play_old'     => 'tfr',\n]];\n\n\n// ---------- מקש 2: יומן שיחות ----------\n// כאן מגדירים קודם את המערך בנפרד ($log), כי רוצים להוסיף לו משהו בלולאה\n$log = [\n    'type'                                              => 'playfile',\n    'say_details_message_first'                         => 'yes',   // קודם מקריאים פרטים ורק אז את ההודעה\n    'say_details_message'                               => 'name,phone,date,time',\n    'say_details_message_say_phone_skip_if_name_exists' => 'yes',   // אם יש שם, לא מקריאים טלפון\n    'login_add_val_name_folder'                         => \"/3/$phone\",\n];\n\n// לולאה קלאסית: $i מתחיל ב-0, ובכל סיבוב גדל ב-1 (i++), עד שמגיע ל-9.\n// בכל סיבוב מוסיפים ל-$log הגדרה: control_play0 => noop, control_play1 => noop ...\n// המשמעות: המקשים 0 עד 9 \"לא עושים כלום\" בזמן ההשמעה.\n// \"control_play$i\" - בתוך מרכאות כפולות, $i מוחלף במספר הנוכחי.\nfor ($i = 0; $i <= 9; $i++) {\n    $log[\"control_play$i\"] = 'noop';\n}\n// כוכבית חוזרת אחורה\n$log['control_play*'] = 'return';\n\n// ואחרי שהמערך מוכן - מוסיפים אותו לרשימה\n$steps[] = [\"/3/$phone/2\", $log];\n\n\n// ---------- מקש 3: מועדפים ----------\n$steps[] = [\"/3/$phone/3\", ['type' => 'playfile']];\n\n\n// ---------- מקש 4: צינתוקים ----------\n$steps[] = [\"/3/$phone/4\", ['type' => 'tzintuk', 'list_tzintuk' => $phone]];\n\n\n// ---------- מקש 5: אנשי קשר ----------\n// השמות נשמרים בקובץ בשלוחה הראשית. כאן רק קובעים את שם הקובץ (בלי סיומת)\n$namesFile = \"/3/$phone/EnterIDValName\";\n\n// 5 - תפריט: 1 = הוספה/שינוי, 2 = מחיקה\n$steps[] = [\"/3/$phone/5\", ['type' => 'menu']];\n\n// 5/1 - המשתמש מקיש טלפון, המערכת משמיעה את השם הקיים (אם יש),\n// ואז מציעה: לשנות (1) או לחזור בלי לשנות (כוכבית)\n$steps[] = [\"/3/$phone/5/1\", [\n    'type'                      => 'menu',\n    'enter_id'                  => 'yes',                      // מבקשים מהמשתמש להקיש מספר\n    'enter_id_type'             => 'phone_or_enter_phone',     // הטלפון שלו, או מספר אחר שיקיש\n    'delete_id_exit'            => 'yes',\n    'record_name'               => 'no',\n    'say_name'                  => 'val_name',                 // משמיע את השם מהקובץ\n    'login_add_val_name'        => 'yes',\n    'login_add_val_name_folder' => \"/3/$phone\",\n]];\n\n// 5/1/1 - הקשת השם החדש במקלדת ושמירה בקובץ\n$steps[] = [\"/3/$phone/5/1/1\", [\n    'type'                         => 'add_id_to_list',\n    'add_id_to_list_location_list' => $namesFile,              // להוספה: שם הקובץ בלי ini\n    'add_id_to_list_value_type'    => 'keyboard',              // השם מוקש במקלדת\n    'login_add_val_name'           => 'yes',\n    'login_add_val_name_folder'    => \"/3/$phone\",\n]];\n\n// 5/2 - מחיקת איש קשר\n$steps[] = [\"/3/$phone/5/2\", [\n    'type'                              => 'add_id_to_list',\n    'remove_id_from_list_location_list' => $namesFile . '.ini',  // להסרה: חובה להוסיף .ini\n    'enter_id'                          => 'yes',\n    'enter_id_type'                     => 'phone',\n    'delete_id_exit'                    => 'yes',\n    'record_name'                       => 'no',\n    'say_name'                          => 'val_name',\n    'login_add_val_name'                => 'yes',\n    'login_add_val_name_folder'         => \"/3/$phone\",\n]];\n\n\n// ===================== פונקציה 3: listMenu =====================\n// גם הרשימה השחורה וגם (בעתיד) רשימות אחרות בנויות אותו דבר:\n// תפריט, ובתוכו \"1 = הוספה\" ו-\"2 = הסרה\".\n// במקום לכתוב את זה כמה פעמים, הפונקציה בונה את שלושת הפריטים לפי שני נתונים:\n//   $base     - הנתיב של התפריט (למשל /3/0501234567/6)\n//   $listFile - שם קובץ הרשימה\n// והיא מחזירה מערך של 3 פריטים (תפריט, הוספה, הסרה) מוכנים להוספה ל-$steps.\nfunction listMenu(string $base, string $listFile): array\n{\n    return [\n        // הפריט הראשון: התפריט עצמו\n        [$base, ['type' => 'menu']],\n\n        // הפריט השני: מקש 1 - הוספה לרשימה\n        [\"$base/1\", [\n            'type'                         => 'add_id_to_list',\n            'add_id_to_list_location_list' => $listFile,            // בלי ini\n            'enter_id'                     => 'yes',\n            'enter_id_type'                => 'phone_or_enter_phone',\n            'delete_id_exit'               => 'yes',\n            'record_name'                  => 'no',\n            'say_name'                     => 'no',\n        ]],\n\n        // הפריט השלישי: מקש 2 - הסרה מהרשימה\n        [\"$base/2\", [\n            'type'                              => 'add_id_to_list',\n            'remove_id_from_list_location_list' => $listFile . '.ini', // עם ini\n            'enter_id'                          => 'yes',\n            'enter_id_type'                     => 'phone',\n            'delete_id_exit'                    => 'yes',\n            'record_name'                       => 'no',\n            'say_name'                          => 'no',\n        ]],\n    ];\n}\n\n\n// ---------- מקש 6: רשימה שחורה ----------\n// listMenu מחזירה 3 פריטים. הלולאה מוסיפה כל אחד מהם ל-$steps.\n// \"as $s\" - בכל סיבוב, $s הוא הפריט הנוכחי.\nforeach (listMenu(\"/3/$phone/6\", \"/3/$phone/BlackList\") as $s) {\n    $steps[] = $s;\n}\n\n\n// ---------- מקש 7: הודמ ----------\n// כרגע תפריט ריק, יטופל בהמשך\n$steps[] = [\"/3/$phone/7\", ['type' => 'menu']];\n\n\n// ---------- מקש 8: שינוי סיסמה ----------\n$steps[] = [\"/3/$phone/8\", [\n    'type'                           => 'change_extension_password',\n    'change_extension_password_what' => \"/3/$phone\",\n]];\n\n\n// ---------- מקש 9: הגדרות ותמיכה ----------\n$steps[] = [\"/3/$phone/9\", ['type' => 'menu']];\n\n\n// ---------- כוכבית: מיקום אחרון ----------\n$steps[] = [\"/3/$phone/*\", ['type' => 'last_play']];\n\n\n// ============================================================================\n//  ביצוע - שליחת כל הרשימה לשרת\n// ============================================================================\n// $ok הוא \"דגל\": true = הכל בסדר עד עכשיו. ברגע שמשהו נכשל הוא הופך ל-false.\n$ok = true;\n\n// הלולאה: עבור כל פריט ב-$steps, פותחים אותו לשני חלקים ($path ו-$params)\n// ושולחים לשרת באמצעות הפונקציה ext.\n// הסימן ! אומר \"לא\": אם ext החזירה \"נכשל\" - מסמנים $ok=false ועוצרים (break).\nforeach ($steps as [$path, $params]) {\n    if (!ext($token, $path, $params)) {\n        $ok = false;\n        break;   // עוצרים את הלולאה - אין טעם להמשיך אחרי כישלון\n    }\n}\n\n\n// ============================================================================\n//  הקראות התפריטים (TTS)\n// ============================================================================\n\n// טקסטים להקראה של שני תפריטים\n$contactsMenuText = 'להוספה או שינוי איש קשר הקש 1, למחיקת איש קשר הקש 2';\n\n// המספר שממנו מעתיקים את הקראת התפריט הראשי\nconst TEMPLATE_PHONE = '0583214264';\n\n// עושים את זה רק אם כל השלוחות נוצרו בהצלחה\nif ($ok) {\n    // ניסיון ראשון: להעתיק קובץ הקראה מוכן מהמספר התבנית\n    $copied = ym('FileAction', [\n        'token'  => $token,\n        'action' => 'copy',\n        'what'   => 'ivr2:3/' . TEMPLATE_PHONE . '/M1000.tts',\n        'target' => \"ivr2:3/$phone/M1000.tts\",\n    ]);\n\n    // אם ההעתקה נכשלה - יוצרים את הקובץ מהטקסט שהגדרנו למעלה ($menuText)\n    if (!$copied) {\n        $ok = ym('UploadTextFile', [\n            'token'    => $token,\n            'what'     => \"ivr2:/3/$phone/M1000.tts\",\n            'contents' => $menuText,\n        ]);\n    }\n}\n\n// רשימה של קבצי הקראה נוספים. כאן המפתח הוא הנתיב של הקובץ, והערך הוא הטקסט שיוקרא.\n// כדי להוסיף הקראה חדשה - מוסיפים עוד שורה כזו.\n$ttsFiles = [\n    \"ivr2:/3/$phone/5/M1000.tts\"   => $contactsMenuText,\n    \"ivr2:/3/$phone/5/1/M1000.tts\" => 'לשינוי או הוספת שם הקש 1, להמשך בלי שינוי הקש כוכבית',\n    \"ivr2:/3/$phone/6/M1000.tts\"   => 'להוספת מספר לרשימה השחורה הקש 1, להסרת מספר מהרשימה הקש 2',\n];\n\n// הלולאה: \"foreach (... as $what => $text)\" נותן בכל סיבוב גם את המפתח ($what = הנתיב)\n// וגם את הערך ($text = הטקסט). שולחים כל אחד לשרת.\nforeach ($ttsFiles as $what => $text) {\n    if (!$ok) { break; }   // אם כבר נכשלנו - לא ממשיכים\n    $ok = ym('UploadTextFile', [\n        'token'    => $token,\n        'what'     => $what,\n        'contents' => $text,\n    ]);\n}\n\n\n// ============================================================================\n//  תשובה למערכת\n// ============================================================================\n// הצלחה: מושמעת הודעה 2573 וממשיכים ל-goto\n// כישלון: מושמעת הודעה 1804 והשיחה מתנתקת\nif ($ok) {\n    print \"id_list_message=m-2573.g-$goto\";\n} else {\n    print \"id_list_message=m-1804.g-hangup\";\n}\nexit();\n\n\n/*\n ============================================================================\n  איך מבצעים שינויים נפוצים\n ============================================================================\n\n א) להוסיף הגדרה לשלוחה קיימת\n    מוצאים את השלוחה ב-$steps ומוסיפים שורה בתוך הסוגריים המרובעים:\n        'שם_ההגדרה' => 'ערך',\n    (חשוב: פסיק בסוף כל שורה)\n\n ב) להוסיף מקש חדש לתפריט (נניח מקש 0)\n    מוסיפים לפני חלק \"ביצוע\":\n        $steps[] = [\"/3/$phone/0\", ['type' => 'menu']];\n\n ג) להוסיף עוד רשימה עם הוספה/הסרה (כמו הרשימה השחורה)\n    שורה אחת בלבד:\n        foreach (listMenu(\"/3/$phone/7\", \"/3/$phone/NewList\") as $s) { $steps[] = $s; }\n\n ד) להוסיף הקראה לתפריט חדש\n    מוסיפים שורה ל-$ttsFiles:\n        \"ivr2:/3/$phone/7/M1000.tts\" => 'הטקסט שיוקרא',\n\n ה) לשנות את הטקסט של התפריט הראשי\n    משנים את $menuText\n\n ו) לשנות מי המספר שממנו מעתיקים הקראה\n    משנים את TEMPLATE_PHONE\n\n ז) אם משהו לא עובד\n    מורידים את השורות error_reporting(0) ו-ini_set בתחילת הקובץ\n    כדי לראות את הודעות השגיאה של PHP, ובודקים בדפדפן.\n*/";
const el=document.getElementById('code'),out=document.getElementById('out');el.value=localStorage.getItem('phpstudio_code')||'<?php\n// כתוב כאן\necho "שלום עולם";';
el.addEventListener('input',()=>localStorage.setItem('phpstudio_code',el.value));
document.getElementById('save').onclick=()=>{localStorage.setItem('phpstudio_code',el.value);out.textContent='נשמר במכשיר ✓'};
document.getElementById('sample').onclick=()=>{el.value=sample;localStorage.setItem('phpstudio_code',sample);out.textContent='נטענה הדוגמה המקורית ✓'};
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([el.value],{type:'text/plain'}));a.download='index.php';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('check').onclick=()=>{const c=el.value,issues=[];if(!c.trim().startsWith('<?php'))issues.push('הקובץ צריך להתחיל ב-<?php');let stack=[],q='',esc=false,line=1;for(let i=0;i<c.length;i++){let x=c[i],n=c[i+1];if(x==='\n')line++;if(q){if(esc){esc=false;continue}if(x==='\\'){esc=true;continue}if(x===q)q='';continue}if(x==='"'||x==="'"){q=x;continue}if('([{'.includes(x))stack.push({x,line});if(')]}'.includes(x)){let want={')':'(',']':'[','}':'{'}[x];if(!stack.length||stack.pop().x!==want)issues.push('סוגר לא תואם בשורה '+line)}}if(q)issues.push('מחרוזת לא נסגרה');if(stack.length)issues.push('סוגר פתוח בשורה '+stack[stack.length-1].line);out.textContent=issues.length?'נמצאו הערות:\n• '+issues.join('\n• '):'לא נמצאו שגיאות בבדיקות הבסיסיות. אין בכך אישור שהקוד תקין להרצה.'};
</script></body></html>
