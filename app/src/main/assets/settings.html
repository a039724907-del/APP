<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הגדרות</title><style>body{margin:0;padding:20px;background:#f3f6fc;color:#17233a;font:16px/1.6 system-ui}a{color:#4568e8;text-decoration:none}.card{background:white;padding:18px;border-radius:16px;margin:15px 0}select,button{padding:11px;border-radius:10px;border:1px solid #dfe5ef;font:inherit}button{background:#4568e8;color:white;border:0}</style></head><body><a href="index.html">← חזרה לבית</a><h1>🎨 הגדרות</h1><div class="card"><h3>ערכת נושא</h3><p>בחר רקע בהיר, כהה או אוטומטי. ההעדפה נשמרת.</p><select id="theme"><option value="light">בהיר</option><option value="dark">כהה</option><option value="auto">לפי המכשיר</option></select><button id="apply">שמור בחירה</button><p id="msg"></p></div><script>let t=localStorage.getItem('phpstudio_theme')||'light';document.getElementById('theme').value=t;document.getElementById('apply').onclick=()=>{t=document.getElementById('theme').value;localStorage.setItem('phpstudio_theme',t);document.getElementById('msg').textContent='ההעדפה נשמרה ✓';document.body.style.background=t==='dark'?'#111827':t==='light'?'#f3f6fc':'';document.body.style.color=t==='dark'?'#f4f6fa':'#17233a'};</script></body></html>
