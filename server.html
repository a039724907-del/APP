<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>שרת מדומה</title><style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#17233a;--muted:#68758d;--blue:#4568e8;--line:#e1e7f0}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,Arial}a{color:var(--blue);text-decoration:none}.card{background:var(--card);padding:16px;border-radius:16px;border:1px solid var(--line);margin:13px 0}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:5px 0 12px;font:14px system-ui}textarea{min-height:100px;direction:ltr;text-align:left;font-family:Consolas,monospace}.ltr{direction:ltr;text-align:left}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 14px;font-size:14px;cursor:pointer}.out{white-space:pre-wrap;background:#101827;color:#e8eef9;border-radius:10px;padding:13px;direction:ltr;text-align:left;overflow:auto;font:13px/1.6 Consolas,monospace}.warn{background:#fff3db;color:#855300;border-radius:10px;padding:12px;font-size:14px}
</style></head><body><a href="index.html">← חזרה לבית</a><h1>🖥️ שרת מדומה</h1><p>הגדר בקשה נכנסת, בדוק את הנתונים שהשרת מקבל, והגדר תגובה משלך.</p><div class="card"><h3>בקשה נכנסת</h3><label>נתיב מלא עם פרמטרים</label><input id="url" class="ltr" value="/api/example.php?ApiPhone=0501234567&goto=/1&token=demo"><label>שיטת בקשה</label><select id="method"><option>GET</option><option>POST</option></select><label>גוף בקשת POST (JSON או key=value)</label><textarea id="body" placeholder='{"user":"דוד","active":true}'></textarea><button class="btn" id="send">שלח בקשה</button></div><div class="card"><h3>📥 הנתונים שהשרת מקבל</h3><pre id="received" class="out">ממתין לבקשה…</pre></div><div class="card"><h3>📤 תגובת השרת (הגדרה שלך)</h3><label>קוד HTTP</label><input id="status" value="200" class="ltr"><label>גוף התגובה</label><textarea id="response">{"responseStatus":"OK","message":"הבקשה התקבלה"}</textarea><button class="btn" id="respond">הצג תגובה</button><pre id="reply" class="out">התגובה תופיע כאן.</pre></div><div class="warn">זהו סימולטור אופליין בלבד: הוא מציג בקשות ותגובות לדוגמה, אך אינו מפעיל מנוע PHP ואינו מאזין לחיבורי רשת.</div><script>
document.getElementById('send').onclick=()=>{let u=new URL(document.getElementById('url').value,'https://offline.local'),g={};u.searchParams.forEach((v,k)=>g[k]=v);let raw=document.getElementById('body').value,p={};if(raw.trim()){try{p=JSON.parse(raw)}catch(e){p=Object.fromEntries(new URLSearchParams(raw))}}let obj={method:document.getElementById('method').value,path:u.pathname,query:g,post:p,rawBody:raw};document.getElementById('received').textContent=JSON.stringify(obj,null,2);localStorage.setItem('phpstudio_last_request',JSON.stringify(obj))};
document.getElementById('respond').onclick=()=>{let s=document.getElementById('status').value,b=document.getElementById('response').value;let x;try{x=JSON.stringify(JSON.parse(b),null,2)}catch(e){x=b}document.getElementById('reply').textContent='HTTP '+s+'\n'+x;localStorage.setItem('phpstudio_response',JSON.stringify({status:s,body:b}))};
</script></body></html>
